<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>SePay Checkout Demo</title>
</head>
<body>
  <p>SePay demo: nhập thông tin đơn rồi bấm “Tạo form & thanh toán”. Form thực sẽ gọi <code>/php/checkout.php</code> để ký đúng secret và tự submit.</p>
  <form id="input_form">
    <div><label>Invoice ID <input type="text" name="invoice_id" value="29" /></label></div>
    <div><label>Amount (VND) <input type="number" name="amount" value="100000" /></label></div>
    <div><label>Description <input type="text" name="description" value="Thanh toan don dat san #28 (booking 123)" /></label></div>
    <div><label>Success URL <input type="text" name="success_url" value="https://hyperpathetic-fugally-erin.ngrok-free.dev/billing/sepay/return?status=success" /></label></div>
    <div><label>Error URL <input type="text" name="error_url" value="https://hyperpathetic-fugally-erin.ngrok-free.dev/billing/sepay/return?status=error" /></label></div>
    <div><label>Cancel URL <input type="text" name="cancel_url" value="https://hyperpathetic-fugally-erin.ngrok-free.dev/billing/sepay/return?status=cancel" /></label></div>
    <button type="submit">Tạo form & thanh toán</button>
  </form>
  <div id="holder"></div>

  <script>
    const form = document.getElementById('input_form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      const res = await fetch('/php/checkout.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
      });
      const json = await res.json();
      if (!res.ok || json.error) {
        alert(json.error || 'Error');
        return;
      }
      document.getElementById('holder').innerHTML = json.form_html;
      document.querySelector('#holder form').submit();
    });
  </script>
</body>
</html>
