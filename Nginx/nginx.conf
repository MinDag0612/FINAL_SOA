worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/json;

    upstream apigateway {
        server api_gateway:5000;
    }

    server {
        listen 80;

        # Root redirect to login
        location = / {
            return 301 /ui/Login/login.html;
        }

        # Serve static UI (HTML/CSS/JS) from /ui/*
        location = /ui {
            return 301 /ui/Login/login.html;
        }
        location = /ui/ {
            return 301 /ui/Login/login.html;
        }
        location /ui/ {
            alias /app/UI/;
            try_files $uri $uri/index.html =404;
        }

        # Route Auth API
        location /auth/ {
            proxy_pass http://apigateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Billing API
        location /billing/ {
            proxy_pass http://apigateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Booking API
        location /booking/ {
            proxy_pass http://apigateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Court API
        location /court/ {
            proxy_pass http://apigateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Facility API
        location /facility/ {
            proxy_pass http://apigateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Notification API
        location /notification/ {
            proxy_pass http://apigateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Report API
        location /report/ {
            proxy_pass http://apigateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route SePay PHP tester/service
        location /sepay-php/ {
            # proxy_pass http://sepay_php/;
            # Tạm tắt - service không tồn tại
            return 404;
            # proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Fallback for other paths - return 404 instead of proxying to API
        location / {
            return 404;
        }
    }
}
