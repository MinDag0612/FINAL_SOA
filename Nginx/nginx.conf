worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/json;

    upstream apigateway {
        server api_gateway:5000;
    }

    server {
        listen 80;

        # Serve static UI (HTML/CSS/JS) from /ui/*
        location = /ui {
            return 301 /ui/;
        }
        location /ui/ {
            alias /app/UI/;
            index Homepage/homepage.html;
            try_files $uri $uri/ /ui/Homepage/homepage.html;
        }

        # Route Auth API
        location /auth/ {
            proxy_pass http://apigateway/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Billing API
        location /billing/ {
            proxy_pass http://apigateway/billing/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Booking API
        location /booking/ {
            proxy_pass http://apigateway/booking/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Court API
        location /court/ {
            proxy_pass http://apigateway/court/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Facility API (same backend service as court)
        location /facility/ {
            proxy_pass http://apigateway/facility/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Session API
        location /session/ {
            proxy_pass http://apigateway/session/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route SePay PHP tester/service
        location /sepay-php/ {
            proxy_pass http://sepay_php/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Optional: route / directly to API Gateway
        location / {
            proxy_pass http://apigateway/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
