<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSport - Đặt Sân Cầu Lông</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../Homepage/homepage.css">
    <script>
        window.CONFIG = {
            BACKEND_PUBLIC_URL: 'https://hyperpathetic-fugally-erin.ngrok-free.dev',
            SEPAY_ENABLED: true
        };
    </script>
</head>
<body>

    <main class="main-content">
        <div class="dashboard-body" id="dynamic-content">
            <!-- Content will be dynamically loaded here -->
        </div>
    </main>

    <div id="toast" class="toast hidden">
        <i class="fa-solid fa-bell"></i>
        <span id="toast-msg">Thông báo mới</span>
    </div>

    <!-- PROFILE EDIT MODAL -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Chỉnh sửa hồ sơ</h3>
                <span class="close-btn" onclick="window.SharedUtils.closeModal('editModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" id="edit-name">
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" id="edit-phone">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="edit-email">
                </div>
                <button class="btn-save" onclick="CustomerDashboard.saveProfile()">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <!-- FACILITY SELECTION MODAL -->
    <div id="selectionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Chọn cơ sở và ngày đặt sân</h3>
                <span class="close-btn" onclick="window.SharedUtils.closeModal('selectionModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Cơ sở</label>
                    <select id="modal-facility"></select>
                </div>
                <div class="form-group">
                    <label>Ngày</label>
                    <input type="date" id="modal-date">
                </div>
                <button class="btn-save" onclick="window.CustomerBooking.confirmSelection()">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- BOOKING DETAIL MODAL -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Chi tiết đặt sân</h3>
                <span class="close-btn" onclick="window.SharedUtils.closeModal('checkoutModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="detail-row">
                    <span class="label">Khách hàng:</span>
                    <span id="c-customer">--</span>
                </div>
                <div class="detail-row">
                    <span class="label">Sân:</span>
                    <span id="c-court-name">--</span>
                </div>
                <div class="detail-row">
                    <span class="label">Giờ bắt đầu:</span>
                    <span id="c-time-detail">--</span>
                </div>
                <div class="detail-row">
                    <span class="label">Thời lượng:</span>
                    <span id="c-duration-detail">--</span>
                </div>
                <div class="detail-row">
                    <span class="label">Trạng thái:</span>
                    <span id="c-status" class="status-badge">--</span>
                </div>
                <div class="detail-row">
                    <span class="label">Đơn giá:</span>
                    <span id="c-price">--</span>
                </div>
                <div class="detail-row total-row">
                    <span class="label">Tổng cộng:</span>
                    <span id="c-total">--</span>
                </div>
                <div id="action-buttons" class="modal-actions">
                    <!-- Action buttons will be dynamically added -->
                </div>
            </div>
        </div>
    </div>

    <!-- QUICK CHECKOUT MODAL -->
    <div id="quickCheckoutModal" class="modal">
        <div class="modal-content" style="max-width: 550px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header">
                <h3 style="margin: 0; font-size: 18px;">Xác nhận đặt sân</h3>
                <span class="close-btn" onclick="window.SharedUtils.closeModal('quickCheckoutModal')">&times;</span>
            </div>
            <div class="modal-body" style="padding: 20px;">
                <!-- Branch Info -->
                <div style="background: #f3f4f6; padding: 12px; border-radius: 6px; margin-bottom: 16px;">
                    <div style="font-weight: 600; color: #1f2937; margin-bottom: 2px; font-size: 14px;" id="qc-branch">Chi nhánh</div>
                    <div style="font-size: 13px; color: #6b7280;" id="qc-address">Địa chỉ</div>
                </div>

                <!-- Slots List -->
                <div style="margin-bottom: 16px;">
                    <h4 style="font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 8px;">Thời gian đã chọn:</h4>
                    <div id="qc-slot" style="font-size: 13px; color: #4b5563; line-height: 1.6;">
                        <!-- Slot list will be populated here -->
                    </div>
                </div>

                <!-- Pricing -->
                <div style="border-top: 1px solid #e5e7eb; padding-top: 12px; margin-bottom: 16px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px;">
                        <span style="color: #6b7280;">Giá/giờ:</span>
                        <span id="qc-price-hour" style="color: #374151; font-weight: 500;">--</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px;">
                        <span style="color: #6b7280;">Số giờ:</span>
                        <span id="qc-hour-count" style="color: #374151; font-weight: 500;">--</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid #e5e7eb;">
                        <span style="font-size: 15px; font-weight: 600; color: #111827;">Tổng cộng:</span>
                        <span id="qc-total" style="font-size: 18px; font-weight: 700; color: #2563eb;">--</span>
                    </div>
                </div>

                <!-- Customer Info Form -->
                <div style="background: #fefefe; border: 1px solid #e5e7eb; border-radius: 6px; padding: 14px; margin-bottom: 16px;">
                    <h4 style="font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 12px;">Thông tin khách hàng</h4>
                    <div style="margin-bottom: 10px;">
                        <label style="display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px;">Họ tên:</label>
                        <input type="text" id="qc-name" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; box-sizing: border-box;" required />
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label style="display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px;">Số điện thoại:</label>
                        <input type="tel" id="qc-phone" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; box-sizing: border-box;" required />
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label style="display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px;">Email:</label>
                        <input type="email" id="qc-email" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; box-sizing: border-box;" required />
                    </div>
                    <div>
                        <label style="display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px;">Mã giảm giá (nếu có):</label>
                        <input type="text" id="qc-coupon" placeholder="Nhập mã coupon" style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; box-sizing: border-box;" />
                    </div>
                </div>

                <!-- Confirm Button -->
                <button onclick="window.CustomerBooking.submitQuickCheckout()" style="width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">
                    Xác nhận & Thanh toán
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../Homepage/apiClient.js"></script>
    <script src="../Homepage/payment_handler.js"></script>
    <script src="../Homepage/shared_utils.js"></script>
    <script src="customer_booking.js"></script>
    <script src="customer_dashboard.js"></script>
    <script src="customer_main.js"></script>
</body>
</html>
